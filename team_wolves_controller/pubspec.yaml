name: team_wolves_controller
description: "Team Wolves - Wolve Bot Pro Controller (RoboRace prototype)."
# Prototype: not published to pub.dev.
publish_to: "none"

version: 0.4.0+1

environment:
  # Previous baseline was >=3.2.0 <4.0.0. The source uses Dart 3 records and
  # switch expressions, which are available from 3.0, so this floor is kept.
  # If the installed SDK is newer, `flutter pub get` will resolve normally.
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # The only approved third-party runtime dependency.
  flutter_blue_plus: ^1.32.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # No assets are declared on purpose: the wolf emblem is a vector CustomPaint,
  # so the first run needs no asset file. When a bitmap logo is approved, add:
  #   assets:
  #     - assets/wolve_logo.png
